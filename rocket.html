    color: #fff; opacity: .32; pointer-events: none; direction: ltr;
  }
</style>
<script type="importmap">

  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <div class="stage"
       data-voxel-logo
       data-voxel-image="assets/rocket shape.png"
       data-voxel-circle="off"></div>

  <script type="module" src="js/voxel-logo.js"></script>
