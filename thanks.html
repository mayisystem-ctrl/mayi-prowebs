<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Google Analytics 4 -->
  <!-- Consent Mode + GA4 + Meta Pixel -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('consent', 'default', {
      ad_storage: 'denied',
      analytics_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied'
    });
    window.mayiConsent = localStorage.getItem('mayi-cookie-consent');
    function mayiInitPixel() {
      if (window.fbq) return;
      !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
      n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}
      (window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '889744503990112');
      fbq('track', 'PageView');
      fbq('track', 'Lead');
    }
    if (window.mayiConsent === 'accept') {
      gtag('consent', 'update', {
        ad_storage: 'granted',
        analytics_storage: 'granted',
        ad_user_data: 'granted',
        ad_personalization: 'granted'
      });
      mayiInitPixel();
    }
    gtag('js', new Date());
    gtag('config', 'G-P16WTQRPNL');
  </script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-P16WTQRPNL"></script>

  <title>הפרטים אצלנו - תודה! | May I</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="assets/logo-favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .thanks {
      min-height: 100svh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: var(--gutter);
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(60% 45% at 50% 30%, rgba(0, 255, 102, .08), transparent 70%),
        radial-gradient(45% 35% at 35% 75%, rgba(214, 251, 76, .06), transparent 70%),
        var(--bg);
    }
    .thanks::before, .thanks::after {
      content: "";
      position: absolute; inset: 0;
      background-image:
        radial-gradient(1.5px 1.5px at 16% 24%, #ffffff55 50%, transparent 51%),
        radial-gradient(1px 1px at 74% 12%, #ffffff44 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 36% 82%, #ffffff33 50%, transparent 51%),
        radial-gradient(1px 1px at 86% 58%, #ffffff55 50%, transparent 51%),
        radial-gradient(1px 1px at 58% 42%, #ffffff2e 50%, transparent 51%);
      animation: thanks-drift 22s linear infinite;
    }
    .thanks::after { transform: scale(1.6); opacity: .5; animation-duration: 34s; }
    @keyframes thanks-drift { to { transform: translateY(-60px); } }

    .thanks__inner { position: relative; z-index: 1; display: grid; justify-items: center; gap: clamp(14px, 2.5vh, 26px); }
    .thanks__check {
      width: clamp(84px, 14vw, 120px);
      aspect-ratio: 1;
      border-radius: 50%;
      border: 2px solid var(--green);
      display: grid;
      place-items: center;
      color: var(--green);
      background: radial-gradient(circle, rgba(0, 255, 102, .16), transparent 70%);
      box-shadow: 0 0 44px -8px var(--green);
    }
    .thanks__check svg { width: 46%; height: 46%; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .thanks__check path { stroke-dasharray: 30; stroke-dashoffset: 30; animation: thanks-draw .7s .25s var(--ease, ease) forwards; }
    @keyframes thanks-draw { to { stroke-dashoffset: 0; } }

    .thanks__title { font-family: var(--font-display); font-size: clamp(30px, 6vw, 54px); color: var(--ink); }
    .thanks__title span { color: var(--green); }
    .thanks__sub { font-family: var(--font-body); font-size: var(--bd-fs); line-height: var(--bd-lh); color: var(--ink-2); max-width: 46ch; }
    .thanks__sub b { color: var(--mustard); font-weight: 600; }
    .thanks__btn { margin-top: 10px; text-decoration: none; }
  </style>
</head>
<body>
  <main class="thanks" aria-labelledby="thanks-title">
    <div class="thanks__inner">
      <div class="thanks__check" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4.5 12.5l5 5 10-11"/></svg></div>
      <h1 class="thanks__title" id="thanks-title">הפרטים <span>אצלנו</span></h1>
      <p class="thanks__sub">תודה שפניתם! אנחנו כבר עוברים על הפרטים וחוזרים אליכם - <b>לפני שהספקת למצמץ</b>.</p>
      <a class="btn thanks__btn" href="/prowebs" style="--c: var(--green);">
        <span class="btn__txt">חזרה לאתר</span>
        <span class="btn__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </a>
    </div>
  </main>
<!-- cookie consent -->
<div class="cookie" id="cookie-consent" role="dialog" aria-labelledby="cookie-title" aria-describedby="cookie-text" dir="rtl" hidden>
  <div class="cookie__head">
    <span class="cookie__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-9.7-8.97 3.5 3.5 0 0 0 4.1 4.1A3.5 3.5 0 0 0 21 12z"/>
        <circle cx="9" cy="9" r=".6" fill="currentColor"/>
        <circle cx="14" cy="14" r=".6" fill="currentColor"/>
        <circle cx="9" cy="15" r=".6" fill="currentColor"/>
        <circle cx="12.5" cy="10.5" r=".6" fill="currentColor"/>
      </svg>
    </span>
    <h2 class="cookie__title" id="cookie-title">קפה ועוגייה לפני שנתחיל?</h2>
  </div>
  <p class="cookie__text" id="cookie-text">אנחנו משתמשים בעוגיות כדי לשפר את החוויה, לזכור העדפות ולהבין מה עובד. בלי קטנוניות - רק כדי שהאתר יהיה טוב יותר.</p>
  <div class="cookie__actions">
    <button class="cookie__btn cookie__btn--accept" type="button" data-cookie="accept">יאללה, מגיע לכם</button>
    <button class="cookie__btn cookie__btn--decline" type="button" data-cookie="decline">רק קפה, תודה</button>
  </div>
</div>
<script>
  (() => {
    const KEY = 'mayi-cookie-consent';
    const box = document.getElementById('cookie-consent');
    if (!box || localStorage.getItem(KEY)) return;
    const show = () => { box.hidden = false; requestAnimationFrame(() => box.classList.add('show')); };
    const waitForLoad = setInterval(() => {
      if (!document.body.classList.contains('loading')) { clearInterval(waitForLoad); setTimeout(show, 800); }
    }, 300);
    const failsafe = setTimeout(() => { clearInterval(waitForLoad); if (box.hidden) show(); }, 8000);
    box.addEventListener('click', (e) => {
      const choice = e.target.closest('[data-cookie]')?.dataset.cookie;
      if (!choice) return;
      clearInterval(waitForLoad);
      clearTimeout(failsafe);
      localStorage.setItem(KEY, choice);
      if (choice === 'accept') {
        if (window.gtag) gtag('consent', 'update', {
          ad_storage: 'granted', analytics_storage: 'granted',
          ad_user_data: 'granted', ad_personalization: 'granted'
        });
        if (window.mayiInitPixel) mayiInitPixel();
      }
      box.classList.remove('show');
      setTimeout(() => { box.hidden = true; }, 500);
    });
  })();
</script>
</body>
</html>
