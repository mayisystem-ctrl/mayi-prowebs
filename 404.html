<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Google Analytics 4 -->
  <!-- Consent Mode + GA4 + Meta Pixel -->

    function gtag(){dataLayer.push(arguments);}
    gtag('consent', 'default', {
      ad_storage: 'denied',
      analytics_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied'
    });
    window.mayiConsent = localStorage.getItem('mayi-cookie-consent');
    function mayiInitPixel() {
      if (window.fbq) return;
      !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
      n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}
      (window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '889744503990112');
      fbq('track', 'PageView');
    }
    if (window.mayiConsent === 'accept') {
      gtag('consent', 'update', {
        ad_storage: 'granted',
        analytics_storage: 'granted',
        ad_user_data: 'granted',
        ad_personalization: 'granted'
      });

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-P16WTQRPNL"></script>

  <title>404 - הלכתם לאיבוד בחלל | May I</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="assets/logo-favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .lost {
      min-height: 100svh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: var(--gutter);
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(60% 45% at 50% 30%, rgba(255, 0, 127, .10), transparent 70%),
        radial-gradient(45% 35% at 65% 75%, rgba(214, 251, 76, .06), transparent 70%),
        var(--bg);
    }
    /* drifting pixel-stars, same voxel DNA as the landing page */
    .lost::before, .lost::after {
      content: "";
      position: absolute; inset: 0;
      background-image:
        radial-gradient(1.5px 1.5px at 12% 22%, #ffffff55 50%, transparent 51%),
        radial-gradient(1px 1px at 78% 14%, #ffffff44 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 32% 78%, #ffffff33 50%, transparent 51%),
        radial-gradient(1px 1px at 88% 62%, #ffffff55 50%, transparent 51%),
        radial-gradient(1px 1px at 54% 44%, #ffffff2e 50%, transparent 51%);
      animation: lost-drift 22s linear infinite;
    }
    .lost::after { transform: scale(1.6); opacity: .5; animation-duration: 34s; }
    @keyframes lost-drift { to { transform: translateY(-60px); } }

    .lost__inner { position: relative; z-index: 1; display: grid; justify-items: center; gap: clamp(14px, 2.5vh, 26px); }
    .lost__code {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(96px, 22vw, 220px);
      line-height: .95;
      letter-spacing: .02em;
      color: var(--ink);
      text-shadow: 0 0 44px rgba(255, 0, 127, .35);
    }
    .lost__code b { color: var(--pink); font-weight: inherit; }
    .lost__title { font-family: var(--font-display); font-size: clamp(26px, 5vw, 44px); color: var(--ink); }
    .lost__title span { color: var(--mustard); }
    .lost__sub { font-family: var(--font-body); font-size: var(--bd-fs); line-height: var(--bd-lh); color: var(--ink-2); max-width: 46ch; }
    .lost__btn { margin-top: 10px; text-decoration: none; }
  </style>
</head>
<body>
  <main class="lost" aria-labelledby="lost-title">
    <div class="lost__inner">
      <div class="lost__code" aria-hidden="true">4<b>0</b>4</div>
      <h1 class="lost__title" id="lost-title">העמוד הזה עף <span>לחלל</span></h1>
      <p class="lost__sub">או שהקישור השתנה, או שהוא מעולם לא היה כאן. בכל מקרה - הדרך הביתה קצרה, נטענת מהר, ולפני שהספקת למצמץ אתם שם.</p>
      <a class="btn lost__btn" href="/prowebs" style="--c: var(--pink);">
        <span class="btn__txt">קחו אותי הביתה</span>
        <span class="btn__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </a>
    </div>
  </main>
<!-- cookie consent -->
<div class="cookie" id="cookie-consent" role="dialog" aria-labelledby="cookie-title" aria-describedby="cookie-text" dir="rtl" hidden>
  <div class="cookie__head">
    <span class="cookie__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-9.7-8.97 3.5 3.5 0 0 0 4.1 4.1A3.5 3.5 0 0 0 21 12z"/>
        <circle cx="9" cy="9" r=".6" fill="currentColor"/>
        <circle cx="14" cy="14" r=".6" fill="currentColor"/>
        <circle cx="9" cy="15" r=".6" fill="currentColor"/>
        <circle cx="12.5" cy="10.5" r=".6" fill="currentColor"/>
      </svg>
    </span>
    <h2 class="cookie__title" id="cookie-title">קפה ועוגייה לפני שנתחיל?</h2>
  </div>
  <p class="cookie__text" id="cookie-text">אנחנו משתמשים בעוגיות כדי לשפר את החוויה, לזכור העדפות ולהבין מה עובד. בלי קטנוניות - רק כדי שהאתר יהיה טוב יותר.</p>
  <div class="cookie__actions">
    <button class="cookie__btn cookie__btn--accept" type="button" data-cookie="accept">יאללה, מגיע לכם</button>
    <button class="cookie__btn cookie__btn--decline" type="button" data-cookie="decline">רק קפה, תודה</button>
  </div>
</div>
<script>
  (() => {
    const KEY = 'mayi-cookie-consent';
    const box = document.getElementById('cookie-consent');
    if (!box || localStorage.getItem(KEY)) return;
    const show = () => { box.hidden = false; requestAnimationFrame(() => box.classList.add('show')); };
    const waitForLoad = setInterval(() => {
      if (!document.body.classList.contains('loading')) { clearInterval(waitForLoad); setTimeout(show, 800); }
    }, 300);
    const failsafe = setTimeout(() => { clearInterval(waitForLoad); if (box.hidden) show(); }, 8000);
    box.addEventListener('click', (e) => {
      const choice = e.target.closest('[data-cookie]')?.dataset.cookie;
      if (!choice) return;
      clearInterval(waitForLoad);
      clearTimeout(failsafe);
      localStorage.setItem(KEY, choice);
      if (choice === 'accept') {
        if (window.gtag) gtag('consent', 'update', {
          ad_storage: 'granted', analytics_storage: 'granted',
          ad_user_data: 'granted', ad_personalization: 'granted'
        });
        if (window.mayiInitPixel) mayiInitPixel();
      }
      box.classList.remove('show');
      setTimeout(() => { box.hidden = true; }, 500);
    });
  })();
</script>
</body>
</html>
